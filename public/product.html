<!DOCTYPE html>
<html lang="en">
<head>
    <title>THE SHOP ZONE</title>
    <link rel="stylesheet" href="./product.css" />
</head>
<body>
    <h1>THE SHOP ZONE</h1>
    <nav>
        <a href="/home">Home</a>
        <a href="/trending">Trending</a>
        <a href="/cart">Cart (<span id="cart-count">0</span>)</a>
        <a href="/services">Services</a>
        <a href="/contact">Contact</a>
    </nav>
    <h2 id="productName"></h2>
    <div id="imageContainer"></div>
    
    <div class="model" id="payment">
        <div class="model-content">
            <h2>Select payment method</h2>
            <span class="close" id="close">&times;</span>
            <button>Credit card</button>
            <button>Google Pay</button>
            <button>Razor Pay</button>
            <button>PhonePe</button>
        </div>
    </div>

    <script>
        window.onload = async function () {
            const params = new URLSearchParams(window.location.search);
            const productKey = params.get("product");

            const response = await fetch(`/api/products/${productKey}`);
            
            if (!response.ok) {
                document.getElementById("productName").textContent = "Product not found.";
                return;
            }

            const sel = await response.json();
            document.getElementById("productName").textContent = sel.name;
            const imageContainer = document.getElementById("imageContainer");
            imageContainer.innerHTML = "";

            sel.images.forEach(url => {
                const itemDiv = document.createElement("div");
                itemDiv.style.display = "inline-block";
                itemDiv.style.textAlign = "center";
                itemDiv.style.margin = "15px";

                const img = document.createElement("img");
                img.src = url;
                img.alt = sel.name;
                img.style.width = "200px";
                img.onerror = function() {
                    this.src = 'https://via.placeholder.com/200?text=' + encodeURIComponent(sel.name);
                };
                if (sel.name === "shoes") { img.style.height = "auto"; }

                const priceTag = document.createElement("h3");
                priceTag.textContent = "Price: ₹" + sel.price;
                priceTag.style.fontWeight = "bold";

                const btn = document.createElement("button");
                btn.textContent = sel.button; 
                btn.style.fontWeight = "bold";
                btn.onclick = () => {
                    document.getElementById("payment").style.display = "block";
                };

                // add-to-cart button
                const cartBtn = document.createElement("button");
                cartBtn.textContent = "Add to Cart";
                cartBtn.style.fontWeight = "bold";
                cartBtn.onclick = () => {
                    addToCart({ id: productKey, name: sel.name, price: sel.price, images: sel.images });
                };

                itemDiv.appendChild(img);
                itemDiv.appendChild(priceTag);
                itemDiv.appendChild(btn);
                itemDiv.appendChild(cartBtn);
                imageContainer.appendChild(itemDiv);
            });

            const modal = document.getElementById("payment");
            const closeBtn = document.getElementById("close");
            
            closeBtn.onclick = () => modal.style.display = "none";
            window.onclick = (event) => {
                if (event.target === modal) modal.style.display = "none";
            };
        };
    </script>
    <script src="index.js"></script>
</body>
</html>
